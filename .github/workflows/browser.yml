name: Praani browser checks
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
        env:
          PRAANI_LIVE_TEST: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: praani-browser-screenshots
          path: test-results/
