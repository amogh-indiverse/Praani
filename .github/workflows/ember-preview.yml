name: Electric Ember preview tests
on:
  push:
    branches: [preview/electric-ember]
  pull_request:
    paths: ['preview/**']
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chrome
      - run: |
          node preview/server.mjs &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          node preview/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electric-ember-screenshots
          path: test-results/
