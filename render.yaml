services:
  - type: web
    name: praani-web
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/amogh-indiverse/Praani
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: praani-postgres-test
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: amogh@indiverse.live
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: praani-postgres-test
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []
